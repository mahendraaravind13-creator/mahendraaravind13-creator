<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" xml:space="preserve">
<style>
.sans{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(560px)}}
@keyframes floor{to{transform:translateY(18px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes g1{0%,84%,100%{transform:translate(0,0);opacity:0}86%{transform:translate(-7px,2px);opacity:.85}90%{transform:translate(6px,-2px);opacity:.85}94%{transform:translate(-3px,1px);opacity:.6}}
@keyframes g2{0%,84%,100%{transform:translate(0,0);opacity:0}86%{transform:translate(7px,-2px);opacity:.85}90%{transform:translate(-6px,2px);opacity:.85}94%{transform:translate(3px,-1px);opacity:.6}}
@keyframes shimmer{from{transform:translateX(-70px)}to{transform:translateX(250px)}}
.blink{animation:blink 1.1s infinite}
.flow{stroke-dasharray:5 9;animation:flow 1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.fadein{animation:fadein 1.2s ease-out both}
.scan{animation:scan 7s linear infinite}
.floor{animation:floor 1.1s linear infinite}
.g1{animation:g1 5s infinite}
.g2{animation:g2 5s infinite}
text{white-space:pre}@keyframes type{from{clip-path:inset(-10px 100% -10px -10px)}to{clip-path:inset(-10px -40px -10px -10px)}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06010f"/><stop offset="1" stop-color="#100428"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<linearGradient id="neonH" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#00f5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00f5ff" stop-opacity=".07"/><stop offset="1" stop-color="#00f5ff" stop-opacity="0"/></linearGradient>
<linearGradient id="shim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".38"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#00f5ff" stop-opacity=".16"/><stop offset="1" stop-color="#00f5ff" stop-opacity="0"/></radialGradient>
<radialGradient id="orb3"><stop offset="0" stop-color="#ff2bd6" stop-opacity=".16"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bigglow" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8b5cf6" stroke-opacity=".09"/></pattern>
<clipPath id="fc"><rect x="1" y="1" width="1198" height="558" rx="22"/></clipPath>
<marker id="a0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#00f5ff"/></marker><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#a78bfa"/></marker><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#ff2bd6"/></marker><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#39ff14"/></marker><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#ffd60a"/></marker>

</defs>
<rect x="1" y="1" width="1198" height="558" rx="22" fill="url(#bg)"/><g clip-path="url(#fc)"><rect width="1200" height="560" fill="url(#grid)"/><circle cx="990" cy="300" r="300" fill="url(#orb)"/><rect class="scan" x="0" y="0" width="1200" height="90" fill="url(#scanG)"/></g><rect x="1" y="1" width="1198" height="558" rx="22" fill="none" stroke="url(#neon)" stroke-width="1.5" opacity=".85"/><path d="M14 34L14 14L34 14" fill="none" stroke="#00f5ff" stroke-width="2" filter="url(#glow)"/><path d="M1186 34L1186 14L1166 14" fill="none" stroke="#00f5ff" stroke-width="2" filter="url(#glow)"/><path d="M14 526L14 546L34 546" fill="none" stroke="#00f5ff" stroke-width="2" filter="url(#glow)"/><path d="M1186 526L1186 546L1166 546" fill="none" stroke="#00f5ff" stroke-width="2" filter="url(#glow)"/>
