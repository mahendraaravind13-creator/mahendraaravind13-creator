<g style="transform-origin:985px 300px;animation:spinr 14s linear infinite"><circle cx="985" cy="300" r="104" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="120 40 20 40"/></g>
<g style="transform-origin:985px 300px;animation:spin 9s linear infinite"><circle cx="985" cy="300" r="80" fill="none" stroke="#ff2bd6" stroke-opacity=".6" stroke-dasharray="60 190"/><circle cx="1065" cy="300" r="4" fill="#ff2bd6" filter="url(#glow)"/></g>
