<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" xml:space="preserve">
<style>
.sans{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(610px)}}
@keyframes floor{to{transform:translateY(18px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes g1{0%,84%,100%{transform:translate(0,0);opacity:0}86%{transform:translate(-7px,2px);opacity:.85}90%{transform:translate(6px,-2px);opacity:.85}94%{transform:translate(-3px,1px);opacity:.6}}
@keyframes g2{0%,84%,100%{transform:translate(0,0);opacity:0}86%{transform:translate(7px,-2px);opacity:.85}90%{transform:translate(-6px,2px);opacity:.85}94%{transform:translate(3px,-1px);opacity:.6}}
@keyframes shimmer{from{transform:translateX(-70px)}to{transform:translateX(250px)}}
.blink{animation:blink 1.1s infinite}
.flow{stroke-dasharray:5 9;animation:flow 1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.fadein{animation:fadein 1.2s ease-out both}
.scan{animation:scan 7s linear infinite}
.floor{animation:floor 1.1s linear infinite}
.g1{animation:g1 5s infinite}
.g2{animation:g2 5s infinite}
</style>
